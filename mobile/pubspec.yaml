name: healthcare_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.9
  # An SVG rendering and widget library for Flutter
  flutter_svg: ^2.3.4
  # Adapting screen and font sizes across different devices
  flutter_screenutil: ^5.9.3
  # Load and cache network images
  cached_network_image: ^3.4.1
  # Easy way to add shimmer loading effect
  shimmer: ^3.0.0
  # Native splash screen generator
  flutter_native_splash: ^2.4.7

  # State Management
  flutter_bloc: ^9.1.1

  # Dependency Injection
  get_it: ^9.3.0

  # Code Generation Annotations (used with freezed & json_serializable)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Networking & API
  dio: ^5.11.1
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0

  # Localization & Formatting
  intl: ^0.20.2
  flutter_localizations:
        sdk: flutter

  # Local Storage & Security
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Firebase
  firebase_core: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints for good coding practices
  flutter_lints: ^6.0.0

  # Code Generation Tools
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  retrofit_generator: ^10.3.3

flutter:
  uses-material-design: true
  assets:
  - assets/splash/
flutter_intl:
  enabled: true
